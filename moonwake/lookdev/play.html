<title>Moonwake</title>
<style>
  /* Layout: one portrait stage (390×844 logical) letterboxed in the viewport; WebGL water below, 2-D overlay above, DOM screens on top. */
  :root {
    --bg: #04070f;
    --fg: #dfe9ff;
    --fg-dim: rgba(223,233,255,0.7);
    --accent: #ffd27a;
    --edge: #59f2ff;
    --card: rgba(6,10,20,0.78);
    --font-display: "Rajdhani", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: var(--font-body); -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
  #frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #stage { position: relative; width: 390px; height: 844px; transform-origin: center center; background: #000; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 390px; height: 844px; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-display); }
  #ui * { pointer-events: none; }
  #ui .tap { pointer-events: auto; }
  .center { position: absolute; left: 0; right: 0; top: 46%; text-align: center; letter-spacing: 0.18em; font-weight: 600; font-size: 17px; text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,0.8); transition: opacity 0.25s; }
  .center small { display: block; margin-top: 8px; font-size: 12px; letter-spacing: 0.1em; color: var(--fg-dim); text-transform: none; }
  #pause { position: absolute; top: calc(44px + env(safe-area-inset-top, 0px)); left: 50%; width: 36px; height: 22px; margin-left: -18px; border-radius: 11px; background: rgba(255,255,255,0.12); border: 0; color: var(--fg); font-size: 12px; line-height: 22px; text-align: center; }
  #card { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 32px; box-sizing: border-box; }
  #card[hidden] { display: none; }
  #card .title { font-size: 13px; letter-spacing: 0.22em; color: var(--fg-dim); text-transform: uppercase; }
  #card .score { font-size: 48px; font-weight: 700; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  #card .lines { font-size: 12px; color: var(--fg-dim); letter-spacing: 0.08em; text-align: center; line-height: 1.6; }
  #card .btn { margin-top: 20px; width: 100%; max-width: 310px; height: 56px; border-radius: 28px; border: 0; background: rgba(255,255,255,0.92); color: #07101c; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.12em; }
  #card .row { display: flex; gap: 12px; width: 100%; max-width: 310px; }
  #card .row .btn { margin-top: 0; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.12); color: var(--fg); font-size: 13px; flex: 1; }
  .btn:focus-visible { outline: 2px solid var(--edge); outline-offset: 2px; }
  #nogl { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 32px; text-align: center; font-family: var(--font-body); color: var(--fg-dim); }
  @media (prefers-reduced-motion: reduce) { .center { transition: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">

<div id="frame">
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="ov"></canvas>
    <div id="ui">
      <div class="center" id="center">Touch to take the helm<small id="centerSub">Moonwake · demo build</small></div>
      <button id="pause" class="tap" aria-label="Pause">▐▐</button>
      <div id="card" hidden>
        <div class="title" id="cardTitle">The bank</div>
        <div class="score" id="cardScore">0</div>
        <div class="lines" id="cardLines"></div>
        <button class="btn tap" id="btnRestart">RESTART</button>
        <div class="row">
          <button class="btn tap" id="btnNew">NEW RIVER</button>
          <button class="btn tap" id="btnDaily">DAILY: OFF</button>
        </div>
      </div>
    </div>
    <div id="nogl">This demo needs WebGL 2, which this browser does not provide.</div>
  </div>
</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a_pos; varying vec2 v_uv;
void main() { v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">

uniform sampler2D u_profile; uniform float u_profileLen; uniform float u_profileBase;
uniform vec2 u_craft; uniform float u_speed; uniform vec2 u_lantern; uniform vec3 u_lanternCol;
uniform vec3 u_deep, u_shallow, u_sky, u_moon, u_land, u_landLit, u_edge, u_fog;

}
</script>
