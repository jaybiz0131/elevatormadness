<title>Shunt Graybox</title>
<style>
  /* Gray-box, sprint 1-4 build plus the audit's Sprint A (design/spy-car-audit-2.pdf). Plain shapes, colour means role. Portrait stage fills the viewport aspect; HUD top 15%, special button bottom corner. */
  :root {
    --bg: #1b1d22; --fg: #f2f4f8; --fg-dim: rgba(242,244,248,0.7);
    --player: #37e6ff; --enemy: #ff3b3b; --civ: #cfe6ff; --pickup: #ffd23f; --hazard: #ff9f1c;
    --font-display: "Rajdhani", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: var(--font-body); -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
  #frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #stage { position: relative; flex-shrink: 0; width: 390px; height: 844px; transform-origin: center center; background: #000; overflow: hidden; }
  #shake { position: absolute; inset: 0; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-display); }
  #ui * { pointer-events: none; }
  #ui .tap { pointer-events: auto; }
  /* callouts live in a slim band under the HUD so they never cover what they describe (audit, UI section) */
  .callout { position: absolute; left: 24px; right: 24px; top: calc(86px + var(--safe-top, 0px)); text-align: center; letter-spacing: 0.16em; font-weight: 700; font-size: 19px; line-height: 1.1; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.9); transition: opacity 0.2s; }
  .callout small { display: block; margin-top: 2px; font-size: 13px; letter-spacing: 0.08em; color: var(--fg-dim); text-transform: none; font-weight: 600; }
  .callout.big { font-size: 64px; top: 38%; }
  #pause { position: absolute; top: calc(18px + var(--safe-top, 0px)); right: 16px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.10); border: 0; color: var(--fg); font-size: 13px; }
  #special { position: absolute; right: 22px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 76px; height: 76px; border-radius: 38px; border: 3px solid rgba(255,255,255,0.35); background: rgba(20,24,30,0.88); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: transform 0.3s, opacity 0.3s; }
  #special[hidden] { display: flex; opacity: 0; transform: translateY(40px) scale(0.6); }
  #special.armed { border-color: var(--pickup); box-shadow: 0 0 18px rgba(255,210,63,0.55); }
  #special.pulse { animation: pulse 0.6s 2; }
  #special svg { width: 32px; height: 32px; }
  #special .pips { display: flex; gap: 3px; } #special .pips i { width: 7px; height: 7px; border-radius: 4px; background: var(--pickup); display: block; }
  #special.left { right: auto; left: 22px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #card { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 28px; box-sizing: border-box; }
  #card[hidden] { display: none; }
  #card .logo { font-size: 54px; font-weight: 700; letter-spacing: 0.3em; color: var(--player); text-shadow: 0 0 24px rgba(55,230,255,0.5); }
  #card .title { font-size: 15px; letter-spacing: 0.2em; color: var(--fg-dim); text-transform: uppercase; text-align: center; }
  #card .score { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #card .newbest { font-size: 18px; letter-spacing: 0.2em; color: var(--pickup); font-weight: 700; }
  #card .lines { font-size: 13px; color: var(--fg-dim); letter-spacing: 0.06em; text-align: center; line-height: 1.6; }
  #card .btn { width: 100%; max-width: 310px; height: 56px; border-radius: 28px; border: 0; background: rgba(255,255,255,0.92); color: #07101c; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.12em; }
  #card .row { display: flex; gap: 10px; width: 100%; max-width: 310px; flex-wrap: wrap; }
  #card .row .btn { height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); color: var(--fg); font-size: 13px; flex: 1; min-width: 90px; }
  #card .row .btn.on { background: rgba(55,230,255,0.25); }
  #card .bar { width: 100%; max-width: 310px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
  #card .bar i { display: block; height: 100%; background: var(--pickup); }
  /* settings: standard rows, a 17 pt label on the left and a switch on the right, grouped (audit, UI section) */
  #settings { width: 100%; max-width: 310px; display: flex; flex-direction: column; gap: 6px; }
  #settings[hidden] { display: none; }
  #settings .grp { font-size: 12px; letter-spacing: 0.16em; color: var(--fg-dim); text-transform: uppercase; margin-top: 10px; }
  #settings label { font-family: var(--font-body); font-size: 17px; color: var(--fg); display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
  #settings label b { font-weight: 600; color: var(--fg-dim); margin-left: 6px; }
  #settings input[type=range] { pointer-events: auto; width: 140px; accent-color: var(--player); }
  .sw { width: 51px; height: 31px; border-radius: 16px; border: 0; background: rgba(255,255,255,0.22); position: relative; padding: 0; flex-shrink: 0; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: left 0.15s; }
  .sw.on { background: var(--player); } .sw.on::after { left: 22px; }
  .sw.seg { width: auto; padding: 0 14px; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.1em; color: var(--fg); background: rgba(255,255,255,0.14); } .sw.seg::after { display: none; }
  /* the death card sits low so the replay plays in the top half behind it */
  #card.over { justify-content: flex-end; padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.2) 38%, rgba(0,0,0,0.82) 52%); }
  .btn:focus-visible { outline: 2px solid var(--player); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .callout { transition: none; } #special.pulse { animation: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">

<div id="frame">
  <div id="stage">
    <div id="shake"><canvas id="cv"></canvas></div>
    <div id="ui">
      <div class="callout" id="callout" style="opacity:0"></div>
      <button id="pause" class="tap" aria-label="Pause"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
      <button id="special" class="tap" aria-label="Special weapon" hidden><span id="specialIcon"></span><span class="pips" id="specialPips"></span></button>
      <div id="card" hidden>
        <div class="logo" id="cardLogo" hidden>SHUNT</div>
        <div class="title" id="cardTitle"></div>
        <div class="score" id="cardScore">0</div>
        <div class="newbest" id="cardNewBest" hidden>NEW BEST</div>
        <div class="lines" id="cardLines"></div>
        <div class="bar" id="cardBar" hidden><i id="cardBarFill" style="width:0%"></i></div>
        <div id="settings" hidden>
          <div class="grp">Audio</div>
          <label><span>Sound</span><button class="sw tap" id="sSound" role="switch" aria-label="Sound"></button></label>
          <label><span>Music</span><button class="sw tap" id="sMusic" role="switch" aria-label="Music"></button></label>
          <div class="grp">Controls</div>
          <label><span>Special button side</span><button class="sw seg tap" id="sHand">RIGHT</button></label>
          <label><span>Sensitivity <b id="sSensVal">1.0×</b></span><input id="sSens" type="range" min="0.7" max="1.6" step="0.1" value="1" aria-label="Sensitivity"></label>
          <label><span>Tap half to Slam</span><button class="sw tap" id="sTapSlam" role="switch" aria-label="Tap half to Slam"></button></label>
          <div class="grp">Accessibility</div>
          <label><span>Haptics</span><button class="sw tap" id="sHaptics" role="switch" aria-label="Haptics"></button></label>
          <label><span>Screen shake</span><button class="sw tap" id="sShake" role="switch" aria-label="Screen shake"></button></label>
          <label><span>Reduce motion</span><button class="sw tap" id="sMotion" role="switch" aria-label="Reduce motion"></button></label>
        </div>
        <button class="btn tap" id="btnPrimary">DRIVE AGAIN</button>
        <div class="row" id="cardRow">
          <button class="btn tap" id="btnA">NEW ROAD</button>
          <button class="btn tap" id="btnB">DAILY RUN</button>
          <button class="btn tap" id="btnC">SETTINGS</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// =====================================================================
// Shunt (working title) — spy car brawler gray-box, sprints 1 to 4 of the
// review (design/spy-car-graybox-review-1.pdf). Plain shapes only.
// World: x lateral in a 390-wide reference space centred on REF, y along
// the road increasing ahead. Every car has its own world speed; the
// player is just one more car with a camera attached. Physics runs at a
// fixed 120 Hz step so collisions do not tunnel at 700 pt/s.
// =====================================================================
const REF = 195, H = 844; let SW = 390;
const T = {
  thumbRatio: 1.4, maxLateral: 520, ease: 0.06, lean: 10, deadZone: 3,
  speed0: 420, speedMax: 700, speedRampMinutes: 5,
  laneW: 62, minLanes: 3, maxLanes: 5,
  fireRate: 6, bulletSpeed: 1100, gunRange: 520, gunHalfLane: 26,
  // Slam (audit, "The Slam, corrected"): 600 pt/s for 0.11 s is about one lane; a flick is 60 stage pt in under 100 ms from a
  // thumb that moved less than 10 pt in the previous 120 ms; it only fires with an enemy within 1.4 lanes on that side and 60 pt ahead or behind
  slam: { flickPt: 60, flickMs: 100, quietPt: 10, quietMs: 120, burst: 0.11, speed: 600, cooldown: 1.0, power: 2.5, reachLanes: 1.4, reachY: 60 },
  shuntMul: 1.5, shuntMin: 220, shuntThreshold: 120, shuntIntent: 80, rearCd: 0.35, armor: 3, invuln: 1.0,
  bruiser: { hold: [0.8, 1.6], tell: 0.6, lunge: 70, lungeSpeed: 260, recover: 1.0, push: 30, closeCap: 180, dropCap: 60 },
  gunner: { sight: 0.8, cooldown: 3.0 },
  ramp: { first: 12, every: [12, 18], warn: 2.0, air: 1.2, steerAir: 0.5, slowmo: 0.7, slowmoFor: 0.3 },
  truckEvery: 25, barrelEvery: 20, closureEvery: 30, forkEvery: [60, 90], onrampEvery: 45, districtEvery: 60,
  missiles: 6, oil: 4, nitro: 3, crateDrop: 0.25,
  combo: { window: 2.5, max: 8 },
  // score by cause (audit, "Give the kills back to the player"): a wreck the player caused pays base × the cause multiplier;
  // the car is the main weapon, so Slam, shunt, ram, wall and oil kills pay 3× a gun kill; enemy-on-enemy accidents pay nothing
  score: { weak: 100, bruiser: 250, gunner: 250, armored: 400, cause: { gun: 1, missile: 1, slam: 3, shunt: 3, ram: 3, rail: 3, wall: 3, oil: 3, stomp: 3, chain: 2, barrel: 2 },
           civilian: -100, crate: 250, graze: 10, grazeCap: 3, truckLoad: 100, clean: 120, closeCall: 25, shuntEnemy: 100, barrelDouble: 150, distancePer: 100 },
  graceSeconds: 30,   // damage halved for the first 30 s only; no free pip; armor comes from the supply truck only
  sizes: { player: [34, 60, 1.0], civ: [34, 58, 0.8], weak: [30, 52, 0.8], bruiser: [40, 70, 1.2], gunner: [40, 76, 1.3], armored: [120, 150, 3.0], truck: [56, 110, 3.0] },
};
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const lerp = (a, b, t) => a + (b - a) * t;
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashI(seed, i) { let h = (seed ^ Math.imul(i + 1, 0x9E3779B1)) >>> 0; h = Math.imul(h ^ h >>> 16, 0x85EBCA6B) >>> 0; h = Math.imul(h ^ h >>> 13, 0xC2B2AE35) >>> 0; return (h ^ h >>> 16) >>> 0; }
function fnv1a(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function localDate() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// ---------------- settings ----------------
const S = { sound: true, music: true, haptics: true, shake: true, motion: false, left: false, sens: 1.0, tapSlam: false };
try { const s = JSON.parse(localStorage.getItem('shunt-settings') || '{}'); Object.assign(S, s); } catch (e) {}
try { if (matchMedia('(prefers-reduced-motion: reduce)').matches && localStorage.getItem('shunt-settings') === null) S.motion = true; } catch (e) {}
function saveSettings() { try { localStorage.setItem('shunt-settings', JSON.stringify(S)); } catch (e) {} }

// ---------------- road ----------------
const DISTRICTS = [
  { name: 'COASTAL', sign: 'COAST HWY', road: '#3a3d45', dark: '#33363d', shoulder: '#262a31', rail: '#9aa3b2' },
  { name: 'DESERT', sign: 'DESERT 0.5 MI', road: '#4a4038', dark: '#423931', shoulder: '#2e2520', rail: '#c9a46a' },
  { name: 'CITY', sign: 'DOWNTOWN', road: '#30333c', dark: '#2a2d35', shoulder: '#1c1f26', rail: '#7e8aa6' },
  { name: 'MOUNTAIN', sign: 'PASS 0.5 MI', road: '#3b4040', dark: '#333838', shoulder: '#222828', rail: '#aab5b5' },
];
class Road {
  constructor(seed) { this.seed = seed; this.knots = [{ y: -600, x: REF, lanes: 4 }, { y: 0, x: REF, lanes: 4 }]; this.built = 0; this.j = 0; this.out = { center: REF, lanes: 4, width: 4 * T.laneW }; }
  ensure(y) { while (this.knots[this.knots.length - 1].y < y + 1800) this.build(); }
  build() {
    const i = this.built++; const rng = mulberry32(hashI(this.seed, i)); const prev = this.knots[this.knots.length - 1]; const y1 = prev.y + 600;
    let lanes = prev.lanes, x = prev.x;
    if (y1 > 1800) {
      if (rng() < 0.45) lanes = clamp(lanes + (rng() < 0.5 ? -1 : 1), T.minLanes, T.maxLanes);
      if (lanes === 3 && prev.lanes === 3 && rng() < 0.7) lanes = 4;   // narrow stretches stay short
      const hw = lanes * T.laneW / 2 + 12;
      x = clamp(prev.x + (rng() * 2 - 1) * 70, 16 + hw, 390 - 16 - hw);
    }
    this.knots.push({ y: y1, x, lanes });
  }
  // Catmull-Rom through the knots. Remembers the last knot index (lookups are nearly always near the previous one) and
  // returns one reused result object, so a lookup costs the same after ten minutes as at the start and allocates nothing.
  at(y) {
    this.ensure(y); const k = this.knots; let j = Math.min(this.j, k.length - 2);
    while (j > 0 && y < k[j].y) j--; while (j + 1 < k.length - 1 && y > k[j + 1].y) j++; this.j = j;
    const p1 = k[j], p2 = k[j + 1], p0 = j > 0 ? k[j - 1] : p1, p3 = j + 2 < k.length ? k[j + 2] : p2;
    const t = clamp((y - p1.y) / (p2.y - p1.y), 0, 1), t2 = t * t, t3 = t2 * t;
    const a = p0.x, b = p1.x, c = p2.x, d = p3.x;
    const center = 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
    const lanes = p1.lanes + (p2.lanes - p1.lanes) * smooth(t);
    const o = this.out; o.center = center; o.lanes = lanes; o.width = lanes * T.laneW; return o;
  }
  laneCount(y) { return Math.round(this.at(y).lanes); }
  laneX(y, i) { const a = this.at(y); const n = Math.round(a.lanes); i = clamp(i, 0, n - 1); return a.center - a.width / 2 + (i + 0.5) * (a.width / n); }
  laneOf(y, x) { const a = this.at(y); const n = Math.round(a.lanes); return clamp(Math.floor((x - (a.center - a.width / 2)) / (a.width / n)), 0, n - 1); }
}

// ---------------- camera ----------------
const PY = 0.22, PX = 0.07, LANE = 0.30;
const ahead = (v) => v * H * (1 + PY * v);
function vFor(a) { const A = PY * H, B = H, C = -a; return (-B + Math.sqrt(Math.max(0, B * B - 4 * A * C))) / (2 * A); }
let camZoom = 1, camLook = 0;
function project(x, y, scroll) { const v = vFor(y - scroll); const ls = (1 - PX * v) * camZoom; const sy = H - v * H; const scale = ls / (1 + 2 * PY * v) * (1 + 2 * PY * LANE) / (1 - PX * LANE); return { x: SW / 2 + (x - REF - camLook) * ls, y: H * 0.7 + (sy - H * 0.7) * camZoom, s: scale, v }; }

// ---------------- audio ----------------
const audio = {
  ctx: null, master: null, sfx: null, musicG: null, engine: null, engineGain: null, layers: [], nextBeat: 0, beat: 0,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } const c = this.ctx;
    this.master = c.createGain(); this.master.connect(c.destination); this.sfx = c.createGain(); this.sfx.gain.value = S.sound ? 1 : 0; this.sfx.connect(this.master); this.musicG = c.createGain(); this.musicG.gain.value = S.music ? 0.5 : 0; this.musicG.connect(this.master);
    const g = c.createGain(); g.gain.value = 0; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400; const o1 = c.createOscillator(), o2 = c.createOscillator(); o1.type = 'sawtooth'; o2.type = 'square'; o1.frequency.value = 70; o2.frequency.value = 35; o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.sfx); o1.start(); o2.start(); this.engine = [o1, o2, f]; this.engineGain = g; },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  apply() { if (!this.ctx) return; this.sfx.gain.value = S.sound ? 1 : 0; this.musicG.gain.value = S.music ? 0.5 : 0; },
  setEngine(speed01, running) { if (!this.ctx) return; const t = this.ctx.currentTime; this.engine[0].frequency.setTargetAtTime(60 + 90 * speed01, t, 0.1); this.engine[1].frequency.setTargetAtTime(30 + 45 * speed01, t, 0.1); this.engine[2].frequency.setTargetAtTime(300 + 900 * speed01, t, 0.1); this.engineGain.gain.setTargetAtTime(running ? 0.04 + 0.04 * speed01 : 0.012, t, 0.1); },
  tone(type, f0, f1, dur, vol, when = 0, dest) { if (!this.ctx) return; const c = this.ctx, t = c.currentTime + when; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur); o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.02); },
  noise(dur, vol, cutoff, when = 0) { if (!this.ctx) return; const c = this.ctx, t = c.currentTime + when; const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; const g = c.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t); },
  shot() { this.tone('square', 1400, 500, 0.04, 0.02); },
  cannon() { this.noise(0.12, 0.5, 900); this.tone('square', 220, 90, 0.12, 0.12); },
  ping(kill) { this.tone('triangle', kill ? 2600 : 2200, kill ? 3200 : 1800, 0.05, 0.05); },
  crunch(bass) { this.noise(0.16, 0.7, 1800); this.tone('sawtooth', 140, 50, 0.16, 0.2); if (bass) this.tone('sine', 70, 30, 0.3, 0.4); },
  wreck() { this.tone('sine', 180, 420, 0.08, 0.15); this.noise(0.5, 0.9, 1200, 0.06); this.tone('sine', 80, 28, 0.55, 0.5, 0.06); },
  chain(n) { this.tone('triangle', 500 + n * 90, 500 + n * 90, 0.12, 0.12); if (n === 3 || n === 5 || n === 8) { this.tone('square', 330 * (n / 3), 660 * (n / 3), 0.25, 0.1, 0.05); this.tone('square', 495 * (n / 3), 990 * (n / 3), 0.35, 0.1, 0.15); } },
  chime() { this.tone('triangle', 660, 660, 0.1, 0.12); this.tone('triangle', 990, 990, 0.25, 0.12, 0.09); },
  horn() { this.tone('sawtooth', 300, 220, 0.4, 0.12); },
  damage() { this.noise(0.25, 0.9, 1500); this.tone('square', 880, 880, 0.08, 0.08, 0.05); this.tone('square', 880, 880, 0.08, 0.08, 0.2); },
  launch() { this.noise(0.5, 0.35, 600); this.tone('sawtooth', 120, 240, 0.5, 0.1); },
  land() { this.noise(0.12, 0.6, 500); this.tone('sine', 90, 50, 0.15, 0.25); },
  stomp() { this.wreck(); this.tone('sine', 50, 25, 0.5, 0.5); },
  missile() { this.noise(0.4, 0.5, 2500); this.tone('sawtooth', 400, 900, 0.4, 0.08); },
