<title>Shunt Graybox</title>
<style>
  /* Phase 1 gray-box: plain shapes, colour means role. Portrait stage fills the viewport aspect; HUD top 15%, special button bottom right. */
  :root {
    --bg: #1b1d22;
    --fg: #f2f4f8;
    --fg-dim: rgba(242,244,248,0.7);
    --player: #37e6ff;
    --enemy: #ff3b3b;
    --civ: #cfe6ff;
    --pickup: #ffd23f;
    --hazard: #ff9f1c;
    --font-display: "Rajdhani", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: var(--font-body); -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
  #frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #stage { position: relative; width: 390px; height: 844px; transform-origin: center center; background: #000; overflow: hidden; }
  #shake { position: absolute; inset: 0; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-display); }
  #ui * { pointer-events: none; }
  #ui .tap { pointer-events: auto; }
  .callout { position: absolute; left: 24px; right: 24px; top: 24%; text-align: center; letter-spacing: 0.16em; font-weight: 700; font-size: 22px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.9); transition: opacity 0.2s; }
  .callout small { display: block; margin-top: 6px; font-size: 15px; letter-spacing: 0.08em; color: var(--fg-dim); text-transform: none; font-weight: 600; }
  .callout.big { font-size: 64px; top: 38%; }
  #pause { position: absolute; top: calc(18px + var(--safe-top, 0px)); right: 16px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.10); border: 0; color: var(--fg); font-size: 13px; }
  #special { position: absolute; right: 22px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 72px; height: 72px; border-radius: 36px; border: 3px solid rgba(255,255,255,0.35); background: rgba(20,24,30,0.85); color: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  #special.armed { border-color: var(--pickup); box-shadow: 0 0 18px rgba(255,210,63,0.55); animation: pulse 1s infinite; }
  #special .pips { display: flex; gap: 3px; } #special .pips i { width: 7px; height: 7px; border-radius: 4px; background: var(--pickup); display: block; }
  #special.left { right: auto; left: 22px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  #card { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 32px; box-sizing: border-box; }
  #card[hidden] { display: none; }
  #card .title { font-size: 15px; letter-spacing: 0.2em; color: var(--fg-dim); text-transform: uppercase; }
  #card .score { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #card .lines { font-size: 13px; color: var(--fg-dim); letter-spacing: 0.06em; text-align: center; line-height: 1.6; }
  #card .btn { margin-top: 20px; width: 100%; max-width: 310px; height: 56px; border-radius: 28px; border: 0; background: rgba(255,255,255,0.92); color: #07101c; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.12em; }
  #card .row { display: flex; gap: 12px; width: 100%; max-width: 310px; }
  #card .row .btn { margin-top: 0; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); color: var(--fg); font-size: 13px; flex: 1; }
  .btn:focus-visible { outline: 2px solid var(--player); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .callout { transition: none; } #special.armed { animation: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">

<div id="frame">
  <div id="stage">
    <div id="shake"><canvas id="cv"></canvas></div>
    <div id="ui">
      <div class="callout" id="callout" style="opacity:0"></div>
      <button id="pause" class="tap" aria-label="Pause">▐▐</button>
      <button id="special" class="tap" aria-label="Special weapon"><span id="specialName">—</span><span class="pips" id="specialPips"></span></button>
      <div id="card" hidden>
        <div class="title" id="cardTitle"></div>
        <div class="score" id="cardScore">0</div>
        <div class="lines" id="cardLines"></div>
        <button class="btn tap" id="btnPrimary">DRIVE AGAIN</button>
        <div class="row">
          <button class="btn tap" id="btnSecond">NEW ROAD</button>
          <button class="btn tap" id="btnHand">RIGHT HAND</button>
          <button class="btn tap" id="btnSound">SOUND: ON</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// =====================================================================
// Shunt (working title) — Phase 1 gray-box of the spy car brawler.
// Plain shapes only. Colour means role. Everything the criteria doc lists
// for the gray-box gate: steer (1:1 relative drag), auto-fire, ram and
// shunt, one enemy (Bruiser), civilians, one ramp, one supply truck.
// Road generator, camera, scoring and chain adapted from Moonwake.
// =====================================================================
const REF = 195, H = 844; let SW = 390;
const T = {
  thumbRatio: 1.4, maxLateral: 520, ease: 0.06, lean: 10, deadZone: 3,
  speed0: 420, speedMax: 700, speedRampMinutes: 5,
  laneW: 62, minLanes: 3, maxLanes: 5, railW: 10,
  fireRate: 6, bulletSpeed: 1100, gunRange: 520, gunHalfLane: 26,
  car: { w: 34, l: 60 }, enemy: { w: 36, l: 64, hp: 4 }, civ: { w: 34, l: 58 }, truck: { w: 56, l: 110 },
  shuntMul: 1.5, shuntMin: 220, rearHitsToWreck: 3, armor: 3,
  bruiserTell: 0.6, bruiserSwerve: 230, bruiserHold: 0.9,
  ramp: { every: [15, 25], warn: 2.0, air: 1.2, steerAir: 0.5, slowmo: 0.7, slowmoFor: 0.3 },
  truckEvery: [25, 35], missiles: 6, crateDrop: 0.15,
  combo: { window: 2.5, max: 8 },
  score: { bruiser: 150, weak: 100, stompMul: 3, chainMul: 2, civilian: -200, crate: 250, graze: 10, truckLoad: 100, clean: 50 },
  graceSeconds: 60,
};
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashI(seed, i) { let h = (seed ^ Math.imul(i + 1, 0x9E3779B1)) >>> 0; h = Math.imul(h ^ h >>> 16, 0x85EBCA6B) >>> 0; h = Math.imul(h ^ h >>> 13, 0xC2B2AE35) >>> 0; return (h ^ h >>> 16) >>> 0; }
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

// ---------------- road ----------------
// Reaches of 600 pt: lane count and centre change smoothly between knots.
class Road {
  constructor(seed) { this.seed = seed; this.reaches = []; this.knots = [{ y: -600, x: REF, lanes: 4 }, { y: 0, x: REF, lanes: 4 }]; }
  reach(i) { while (this.reaches.length <= i) this.build(this.reaches.length); return this.reaches[i]; }
  build(i) {
    const rng = mulberry32(hashI(this.seed, i)); const y0 = i * 600, y1 = y0 + 600;
    const prev = this.knots[this.knots.length - 1];
    let lanes = prev.lanes, x = prev.x;
    if (y0 >= 1200) {
      if (rng() < 0.45) lanes = clamp(lanes + (rng() < 0.5 ? -1 : 1), T.minLanes, T.maxLanes);
      const hw = lanes * T.laneW / 2 + T.railW;
      x = clamp(prev.x + (rng() * 2 - 1) * 70, 16 + hw, 390 - 16 - hw);
    }
    this.knots.push({ y: y1, x, lanes });
    const r = { i, y0, y1, fork: null };
    this.reaches.push(r);
    return r;
  }
  at(y) {   // {center, lanes(float), width}
    const k = this.knots; let j = 0; while (j + 1 < k.length - 1 && y > k[j + 1].y) j++;
    const p1 = k[j], p2 = k[j + 1], p0 = k[j - 1] || { y: p1.y - 600, x: p1.x, lanes: p1.lanes }, p3 = k[j + 2] || { y: p2.y + 600, x: p2.x, lanes: p2.lanes };
    const t = clamp((y - p1.y) / (p2.y - p1.y), 0, 1), t2 = t * t, t3 = t2 * t;
    const cr = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
    const center = cr(p0.x, p1.x, p2.x, p3.x);
    const lanes = p1.lanes + (p2.lanes - p1.lanes) * smooth(t);
    return { center, lanes, width: lanes * T.laneW };
  }
  left(y) { const a = this.at(y); return a.center - a.width / 2; }
  right(y) { const a = this.at(y); return a.center + a.width / 2; }
  laneX(y, i) { const a = this.at(y); const n = Math.round(a.lanes); return a.center - a.width / 2 + T.laneW * (i + 0.5) * (a.width / (n * T.laneW)); }
  laneCount(y) { return Math.round(this.at(y).lanes); }
}

// ---------------- camera (reused from Moonwake, gentler tilt ~20°) ----------------
const PY = 0.22, PX = 0.07, LANE = 0.30;
const ahead = (v) => v * H * (1 + PY * v);
function vFor(a) { const A = PY * H, B = H, C = -a; return (-B + Math.sqrt(Math.max(0, B * B - 4 * A * C))) / (2 * A); }
let camZoom = 1;
function project(x, y, scroll) { const v = vFor(y - scroll); const ls = (1 - PX * v) * camZoom; const sy = H - v * H; const scale = ls / (1 + 2 * PY * v) * (1 + 2 * PY * LANE) / (1 - PX * LANE); return { x: SW / 2 + (x - REF) * ls, y: H * 0.7 + (sy - H * 0.7) * camZoom, s: scale, v }; }

// ---------------- audio (procedural) ----------------
const audio = {
  ctx: null, on: true, master: null, engine: null, engineGain: null,
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } const c = this.ctx; this.master = c.createGain(); this.master.gain.value = this.on ? 1 : 0; this.master.connect(c.destination);
    const g = c.createGain(); g.gain.value = 0.0; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400; const o1 = c.createOscillator(), o2 = c.createOscillator(); o1.type = 'sawtooth'; o2.type = 'square'; o1.frequency.value = 70; o2.frequency.value = 35; o1.connect(f); o2.connect(f); f.connect(g); g.connect(this.master); o1.start(); o2.start(); this.engine = [o1, o2, f]; this.engineGain = g; },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setEngine(speed01, running) { if (!this.ctx) return; const t = this.ctx.currentTime; this.engine[0].frequency.setTargetAtTime(60 + 90 * speed01, t, 0.1); this.engine[1].frequency.setTargetAtTime(30 + 45 * speed01, t, 0.1); this.engine[2].frequency.setTargetAtTime(300 + 900 * speed01, t, 0.1); this.engineGain.gain.setTargetAtTime(running ? 0.045 + 0.04 * speed01 : 0.015, t, 0.1); },
  tone(type, f0, f1, dur, vol, when = 0) { if (!this.ctx) return; const c = this.ctx, t = c.currentTime + when; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02); },
  noise(dur, vol, cutoff) { if (!this.ctx) return; const c = this.ctx, t = c.currentTime; const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; const g = c.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(this.master); s.start(t); },
  shot() { this.tone('square', 1400, 500, 0.04, 0.025); },
  ping() { this.tone('triangle', 2200, 1800, 0.05, 0.05); },
  crunch() { this.noise(0.16, 0.7, 1800); this.tone('sawtooth', 140, 50, 0.16, 0.2); },
  explode() { this.noise(0.5, 0.9, 1200); this.tone('sine', 110, 35, 0.45, 0.3); },
  chain(n) { this.tone('triangle', 500 + n * 90, 500 + n * 90, 0.12, 0.12); },
  chime() { this.tone('triangle', 660, 660, 0.1, 0.12); this.tone('triangle', 990, 990, 0.25, 0.12, 0.09); },
  horn() { this.tone('sawtooth', 300, 220, 0.4, 0.12); },
  damage() { this.noise(0.25, 0.9, 1500); this.tone('square', 880, 880, 0.08, 0.08, 0.05); this.tone('square', 880, 880, 0.08, 0.08, 0.2); },
  launch() { this.noise(0.5, 0.35, 600); this.tone('sawtooth', 120, 240, 0.5, 0.1); },
  land() { this.noise(0.12, 0.6, 500); this.tone('sine', 90, 50, 0.15, 0.25); },
  missile() { this.noise(0.4, 0.5, 2500); this.tone('sawtooth', 400, 900, 0.4, 0.08); },
  death() { this.noise(1.0, 1.0, 900); this.tone('sawtooth', 200, 30, 1.0, 0.25); },
  toggle() { this.on = !this.on; if (this.master) this.master.gain.value = this.on ? 1 : 0; try { localStorage.setItem('shunt-sound', this.on ? '1' : '0'); } catch (e) {} },
};
try { audio.on = localStorage.getItem('shunt-sound') !== '0'; } catch (e) {}
const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

// ---------------- state ----------------
const stage = document.getElementById('stage'), shakeEl = document.getElementById('shake'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const ui = { callout: document.getElementById('callout'), pause: document.getElementById('pause'), special: document.getElementById('special'), specialName: document.getElementById('specialName'), specialPips: document.getElementById('specialPips'), card: document.getElementById('card'), cardTitle: document.getElementById('cardTitle'), cardScore: document.getElementById('cardScore'), cardLines: document.getElementById('cardLines'), primary: document.getElementById('btnPrimary'), second: document.getElementById('btnSecond'), hand: document.getElementById('btnHand'), sound: document.getElementById('btnSound') };
const dpr = Math.min(window.devicePixelRatio || 1, 3);
let G, phase = 'attract', now = 0, lastT = 0, elapsed = 0, countdown = 0, pausedFrom = 'playing';
let seed = (Math.random() * 4294967296) >>> 0, best = 0, leftHand = false, hadRun = false;
try { best = Number(localStorage.getItem('shunt-best') || 0); leftHand = localStorage.getItem('shunt-left') === '1'; } catch (e) {}
const fmt = (n) => n.toLocaleString('en-US');
let calloutTimer = null;
function callout(text, sub, ms = 1100, big = false) { ui.callout.textContent = text; if (sub) { const s = document.createElement('small'); s.textContent = sub; ui.callout.appendChild(s); } ui.callout.classList.toggle('big', big); ui.callout.style.opacity = 1; clearTimeout(calloutTimer); if (ms > 0) calloutTimer = setTimeout(() => { ui.callout.style.opacity = 0; }, ms); }
function hideCallout() { clearTimeout(calloutTimer); ui.callout.style.opacity = 0; }

function newRun(reseed) {
  if (reseed) seed = (Math.random() * 4294967296) >>> 0;
  const road = new Road(seed); road.reach(6);
  G = { road, rng: mulberry32(seed ^ 0x5bd1e995), t: 0, dist: 0, speed: T.speed0, x: REF, vx: 0, targetX: REF, lean: 0,
        armor: T.armor, score: 0, cash: 0, combo: 0, comboT: 0, comboPeak: 1, kills: 0, civHits: 0,
        cars: [], bullets: [], missiles: [], crates: [], ramps: [], trucks: [], fx: [], pops: [], sparks: [],
        air: 0, airTotal: 0, jumpZ: 0, slowmo: 0, hitStop: 0, shake: 0, vignette: 0, smoke: 0,
        special: { name: null, ammo: 0 }, nextRamp: 0, nextTruck: 0, nextSpawn: 0, lastEvent: 0, scripted: true, script: 0, deadAt: 0, cause: '', boost: 0, rearHits: 0, grazeT: 0, gunCd: 0, flash: 0, ghostThumb: 0, replay: [] };
  G.nextRamp = 40; G.nextTruck = 22;
  input.reset();
  ui.card.hidden = true; updateSpecialButton();
}
function enterAttract() { phase = 'attract'; callout('Touch to drive', isTouch ? 'slide to steer · the car goes where your thumb goes' : 'arrows or A/D steer · space fires the special', 0); }
function startPlaying() { phase = 'playing'; hideCallout(); hadRun = true; G.t = 0; }

// ---------------- input: relative drag, 1:1 scaled ----------------
const input = {
  id: null, anchor: null, carAnchor: 0, cur: null, keys: {}, sens: 1.0,
  reset() { this.id = null; this.anchor = null; this.cur = null; },
  down(id, x, y) { if (this.id !== null) return; this.id = id; this.anchor = { x, y }; this.cur = { x, y }; this.carAnchor = G.targetX; },
  move(id, x, y) { if (id !== this.id) return; this.cur = { x, y }; },
  up(id) { if (id === this.id) { this.id = null; this.anchor = null; this.cur = null; } },
  target(dt) {
    if (this.keys.left || this.keys.right) { return G.targetX + ((this.keys.right ? 1 : 0) - (this.keys.left ? 1 : 0)) * T.maxLateral * dt; }
    if (!this.anchor) return G.targetX;
    let dx = this.cur.x - this.anchor.x; if (Math.abs(dx) < T.deadZone) dx = 0; else dx -= Math.sign(dx) * T.deadZone;
    return this.carAnchor + dx * T.thumbRatio * this.sens;
  },
};
function stagePoint(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * SW, y: (e.clientY - r.top) / r.height * H }; }
stage.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.tap')) return;
  e.preventDefault(); audio.init(); audio.resume();
  if (phase === 'over' || phase === 'paused' || phase === 'countdown') return;
  if (phase === 'attract') startPlaying();
  const p = stagePoint(e); input.down(e.pointerId, p.x, p.y);
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});
stage.addEventListener('pointermove', e => { const p = stagePoint(e); input.move(e.pointerId, p.x, p.y); });
const upH = e => input.up(e.pointerId);
stage.addEventListener('pointerup', upH); stage.addEventListener('pointercancel', upH);
const KEYS = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ' ': 'fire', j: 'fire' };
window.addEventListener('keydown', e => { const k = KEYS[e.key]; if (!k) { if (e.key === 'p' || e.key === 'Escape') togglePause(); return; } e.preventDefault(); audio.init(); audio.resume(); if (phase === 'attract') startPlaying(); if (phase === 'over' && k === 'fire') { restartAndPlay(false); return; } if (k === 'fire') { if (!input.keys.fire) fireSpecial(); } input.keys[k] = true; });
window.addEventListener('keyup', e => { const k = KEYS[e.key]; if (k) { e.preventDefault(); input.keys[k] = false; } });
ui.special.addEventListener('pointerdown', e => { e.preventDefault(); audio.init(); audio.resume(); if (phase === 'playing') fireSpecial(); });
ui.pause.addEventListener('click', () => { audio.init(); togglePause(); });
ui.primary.addEventListener('click', () => { audio.init(); audio.resume(); if (phase === 'paused') resume(); else if (phase === 'over') restartAndPlay(false); });
ui.second.addEventListener('click', () => { audio.init(); if (phase === 'paused') { newRun(false); enterAttract(); } else if (phase === 'over') restartAndPlay(true); });
ui.hand.addEventListener('click', () => { leftHand = !leftHand; try { localStorage.setItem('shunt-left', leftHand ? '1' : '0'); } catch (e) {} applyHand(); });
ui.sound.addEventListener('click', () => { audio.init(); audio.toggle(); ui.sound.textContent = audio.on ? 'SOUND: ON' : 'SOUND: OFF'; });
document.addEventListener('visibilitychange', () => { if (document.hidden && (phase === 'playing' || phase === 'attract' || phase === 'countdown')) pause(); });
function applyHand() { ui.special.classList.toggle('left', leftHand); ui.hand.textContent = leftHand ? 'LEFT HAND' : 'RIGHT HAND'; }
function restartAndPlay(reseed) { newRun(reseed); startPlaying(); }
function togglePause() { if (phase === 'paused') resume(); else if (phase === 'playing' || phase === 'attract') pause(); }
function pause() { pausedFrom = phase === 'countdown' ? 'playing' : phase; phase = 'paused'; ui.cardTitle.textContent = 'Paused'; ui.cardScore.textContent = fmt(G.score); ui.cardLines.textContent = ''; ui.primary.textContent = 'RESUME'; ui.second.textContent = 'RESTART'; ui.sound.textContent = audio.on ? 'SOUND: ON' : 'SOUND: OFF'; ui.card.hidden = false; }
function resume() { ui.card.hidden = true; ui.primary.textContent = 'DRIVE AGAIN'; ui.second.textContent = 'NEW ROAD'; input.reset(); lastT = 0; if (pausedFrom === 'playing') { phase = 'countdown'; countdown = 3; callout('3', '', 0, true); } else { phase = pausedFrom; enterAttract(); } }

// ---------------- spawning ----------------
function laneCountAt(y) { return G.road.laneCount(y); }
function spawnCar(kind, lane, yAhead, opts = {}) {
  const y = G.dist + yAhead; const n = laneCountAt(y); lane = clamp(lane, 0, n - 1);
  const c = Object.assign({ kind, lane, x: G.road.laneX(y, lane), y, vx: 0, vy: 0, alive: true, hp: kind === 'bruiser' ? T.enemy.hp : 2, state: 'approach', t: 0, tell: 0, rearHits: 0, spin: 0, wrecked: false, speedRel: 0, id: Math.random() }, opts);
  if (kind === 'civ') { c.speedRel = -(60 + G.rng() * 60); c.tint = ['#cfe6ff', '#fff1c9', '#cdebdc', '#e9d9ff'][Math.floor(G.rng() * 4)]; }
  if (kind === 'weak') { c.speedRel = -(40 + G.rng() * 40); c.hp = 2; }
  if (kind === 'bruiser') { c.speedRel = opts.slow ? 40 : 90; }
  G.cars.push(c); if (kind !== 'civ') event(); return c;   // a new threat counts for the 3-second rule
}
