<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Shunt 3D</title>
<style>
  /* Gray-box, sprint 1-4 build plus the audit's Sprint A (design/spy-car-audit-2.pdf). Plain shapes, colour means role. Portrait stage fills the viewport aspect; HUD top 15%, special button bottom corner. */
  :root {
    --bg: #1b1d22; --fg: #f2f4f8; --fg-dim: rgba(242,244,248,0.7);
    --player: #37e6ff; --enemy: #ff3b3b; --civ: #cfe6ff; --pickup: #ffd23f; --hazard: #ff9f1c;
    --font-display: "Rajdhani", "Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; }   /* read by fit() in main.js for --safe-top and --safe-bottom */
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: var(--font-body); -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; }
  #frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #stage { position: relative; flex-shrink: 0; width: 390px; height: 844px; transform-origin: center center; background: #000; overflow: hidden; }
  #shake { position: absolute; inset: 0; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-display); }
  #ui * { pointer-events: none; }
  #ui .tap { pointer-events: auto; }
  /* callouts live in a slim band under the HUD so they never cover what they describe (audit, UI section) */
  .callout { position: absolute; left: 24px; right: 24px; top: calc(86px + var(--safe-top, 0px)); text-align: center; letter-spacing: 0.16em; font-weight: 700; font-size: 19px; line-height: 1.1; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.9); transition: opacity 0.2s; }
  .callout small { display: block; margin-top: 2px; font-size: 13px; letter-spacing: 0.08em; color: var(--fg-dim); text-transform: none; font-weight: 600; }
  .callout.big { font-size: 64px; top: 38%; }
  /* debug readout (Settings > Debug readout, or ?debug=1): FPS and draw calls under the pause button */
  #dbg { position: absolute; top: calc(70px + var(--safe-top, 0px)); right: 12px; font: 600 13px/1.35 ui-monospace, Menlo, monospace; color: #9fe8c0; background: rgba(0,0,0,0.55); padding: 4px 7px; border-radius: 6px; pointer-events: none; text-align: right; white-space: pre; z-index: 5; }
  #dbg.over { color: #ffb02a; }
  #dbg[hidden] { display: none; }
  #pause { position: absolute; top: calc(18px + var(--safe-top, 0px)); right: 16px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.10); border: 0; color: var(--fg); font-size: 13px; }
  /* pedal pad bottom right (brake; hold while steering = drift), special button above it; both mirror with the handedness setting */
  #pad { position: absolute; right: 18px; bottom: calc(24px + var(--safe-bottom, 0px)); width: 100px; height: 100px; border-radius: 50px; border: 3px solid rgba(255,255,255,0.28); background: rgba(20,24,30,0.78); color: var(--fg-dim); font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #pad.held { background: rgba(55,230,255,0.22); border-color: var(--player); color: var(--fg); }
  #pad.left { right: auto; left: 18px; }
  #pad[hidden] { display: none; }
  /* Sprint 4 cluster: GAS (big, bottom right), BRAKE beside it, FIRE above GAS, SPECIAL above BRAKE; mirrored for left hand */
  #pad { right: 128px; width: 84px; height: 84px; border-radius: 42px; }
  #gas { position: absolute; right: 18px; bottom: calc(16px + var(--safe-bottom, 0px)); width: 100px; height: 100px; border-radius: 50px; border: 3px solid rgba(255,255,255,0.28); background: rgba(20,24,30,0.78); color: var(--fg-dim); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.14em; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #gas.held { background: rgba(255,210,63,0.2); border-color: var(--pickup); color: var(--fg); }
  #fire { position: absolute; right: 18px; bottom: calc(22px + var(--safe-bottom, 0px)); width: 104px; height: 104px; border-radius: 52px; border: 3px solid rgba(255,255,255,0.28); background: rgba(20,24,30,0.78); color: var(--fg-dim); font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #fire.held { background: rgba(255,80,60,0.25); border-color: #ff5a3c; color: var(--fg); }
  #fire.hot { border-color: #ff8a3c; box-shadow: 0 0 14px rgba(255,120,40,0.6); }
  #gas.left { right: auto; left: 18px; } #fire.left { right: auto; left: 18px; } #pad.left { right: auto; left: 128px; }
  /* Stop 4 (Jack): GAS stays automatic. The right thumb rocks between FIRE (large) and BRAKE (large) side by side at the bottom, 20 px apart so a rock never
     lands on the wrong one; MISSILE sits above FIRE and the spot above BRAKE (right 142 px, bottom 150 px, 84 px) is kept free for BOOST (Stop 5). Left hand mirrors it.
     There is no auto-fire: the gatling fires only while FIRE is held, from the instant of the press. */
  #gas, #gas[hidden] { display: none !important; }
  #fire { right: 14px; bottom: calc(18px + var(--safe-bottom, 0px)); width: 112px; height: 112px; border-radius: 56px; font-size: 16px; }
  #pad { right: 146px; bottom: calc(18px + var(--safe-bottom, 0px)); width: 112px; height: 112px; border-radius: 56px; font-size: 16px; }
  #pad.held { background: rgba(255,210,63,0.2); border-color: var(--pickup); }
  #fire.left { right: auto; left: 14px; } #pad.left { right: auto; left: 146px; }
  #camBtn { position: absolute; top: calc(70px + var(--safe-top, 0px)); right: 16px; min-width: 52px; height: 32px; padding: 0 10px; border-radius: 16px; border: 0; background: rgba(255,255,255,0.10); color: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; } #camBtn[hidden] { display: none; }
  #card .camsel { display: flex; align-items: center; gap: 6px; } #card .camsel span { font-size: 13px; letter-spacing: 0.2em; color: rgba(255,255,255,0.7); margin-right: 4px; }
  #card .camsel button { height: 36px; padding: 0 11px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.22); background: rgba(10,14,24,0.6); color: var(--fg); font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; } #card .camsel button.on { background: rgba(55,230,255,0.28); border-color: #37e6ff; } #card .camsel[hidden] { display: none; }
  #boost { position: absolute; right: 150px; bottom: calc(148px + var(--safe-bottom, 0px)); width: 84px; height: 84px; border-radius: 42px; border: 3px solid rgba(255,255,255,0.28); background: rgba(20,24,30,0.78); color: var(--fg-dim); font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; } #boost[hidden] { display: none; } #boost.left { right: auto; left: 150px; }
  #gas[hidden], #fire[hidden] { display: none; }
  #special { position: absolute; right: 28px; bottom: calc(148px + var(--safe-bottom, 0px)); width: 84px; height: 84px; border-radius: 41px; border: 3px solid rgba(255,255,255,0.35); background: rgba(20,24,30,0.88); color: var(--fg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: transform 0.3s, opacity 0.3s; }
  #special[hidden] { display: flex; opacity: 0; transform: translateY(40px) scale(0.6); }
  #special.armed { border-color: var(--pickup); box-shadow: 0 0 18px rgba(255,210,63,0.55); }
  #special.empty { opacity: 0.45; }
  #special.pulse { animation: pulse 0.6s 2; }
  #special svg { width: 36px; height: 36px; }
  /* the ammo count: a bold badge on the button's corner (missiles, oil or nitro left) */
  #special .pips { position: absolute; top: -6px; right: -8px; min-width: 30px; height: 30px; padding: 0 7px; box-sizing: border-box; border-radius: 15px; background: var(--pickup); color: #171204; font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 30px; text-align: center; font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(0,0,0,0.55); }
  #special .pips:empty { display: none; }
  #special.empty .pips { background: rgba(255,255,255,0.3); color: #fff; }
  #special.left .pips { right: auto; left: -8px; }
  #special.left { right: auto; left: 28px; }
  /* Stop 5: the shock-mine count (hold MISSILE to drop one) and the BOOST meter, which fills the button from the bottom */
  #special .mines { position: absolute; bottom: -8px; left: -8px; min-width: 30px; height: 26px; padding: 0 7px; box-sizing: border-box; border-radius: 13px; background: #7b4dff; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 26px; text-align: center; font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(0,0,0,0.55); }
  #special .mines::before { content: 'MINE '; font-size: 10px; letter-spacing: 0.06em; opacity: 0.85; } #special .mines.none { background: rgba(255,255,255,0.28); }
  #special.left .mines { left: auto; right: -8px; }
  #special.charging { border-color: #b48cff; box-shadow: 0 0 22px rgba(150,100,255,0.8); transform: scale(1.06); }
  #boost { background: linear-gradient(to top, rgba(255,150,40,0.92) 0%, rgba(255,150,40,0.92) var(--fill, 0%), rgba(20,24,30,0.82) var(--fill, 0%)); color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); overflow: hidden; }
  #boost[hidden] { display: none; }
  #boost.ready { border-color: #ffc860; box-shadow: 0 0 20px rgba(255,170,60,0.7); }
  #boost.ready .blbl { animation: pulse 0.7s infinite; display: inline-block; }
  #boost.on { background: #ffe9a8; color: #5a2a00; border-color: #fff; box-shadow: 0 0 30px rgba(255,200,80,0.95); text-shadow: none; }
  #boost.held { transform: scale(0.94); }
  /* Driver control: the right thumb drives from one big puck (touch is gas, down brake then reverse, right gas and fire, left e-brake); MISSILE and BOOST are small
     buttons above it. "Simple buttons" swaps the puck for GAS, BRAKE, FIRE and E-BRAKE. #ui.lefty mirrors all of it for the left hand. */
  #puck { position: absolute; right: 12px; bottom: calc(14px + var(--safe-bottom, 0px)); width: 196px; height: 196px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.3); background: radial-gradient(circle, rgba(20,24,30,0.55) 0%, rgba(20,24,30,0.86) 70%); touch-action: none; user-select: none; -webkit-user-select: none; }
  #puck[hidden] { display: none; }
  #puck .pz { position: absolute; font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.55); text-align: center; line-height: 1.1; pointer-events: none; transition: color 0.1s; }
  #puck .pzU { top: 12px; left: 0; right: 0; } #puck .pzD { bottom: 10px; left: 0; right: 0; font-size: 11px; } #puck .pzR { right: 9px; top: 50%; transform: translateY(-50%); } #puck .pzL { left: 6px; top: 50%; transform: translateY(-50%); font-size: 10px; }
  #puck .pring { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.22); pointer-events: none; }
  #puck.g .pzU { color: #ffd23f; } #puck.b .pzD { color: #ff8a3c; } #puck.f .pzR { color: #ff5a3c; } #puck.e .pzL { color: #7fe8ff; }
  #puck.f { border-color: rgba(255,90,60,0.7); } #puck.e { border-color: rgba(120,230,255,0.7); }
  #puckDot { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.6); box-shadow: 0 0 12px rgba(55,230,255,0.4); pointer-events: none; transform: translate(0px, 0px); }
  #puck.on #puckDot { background: rgba(55,230,255,0.45); border-color: #37e6ff; }
  #ui.puckmode #fire, #ui.puckmode #pad, #ui.puckmode #gas, #ui.puckmode #ebrake { display: none !important; }
  #ui.puckmode #special { right: 22px; bottom: calc(224px + var(--safe-bottom, 0px)); width: 70px; height: 70px; }
  #ui.puckmode #boost { right: 110px; bottom: calc(224px + var(--safe-bottom, 0px)); width: 70px; height: 70px; font-size: 11px; }
  #ui.simplemode #puck { display: none !important; }
  #ui.simplemode #gas { display: block !important; right: 14px; bottom: calc(16px + var(--safe-bottom, 0px)); width: 98px; height: 98px; border-radius: 49px; }
  #ui.simplemode #gas[hidden], #ui.simplemode #pad[hidden], #ui.simplemode #fire[hidden], #ui.simplemode #ebrake[hidden] { display: none !important; }
  #ui.simplemode #pad { right: 122px; bottom: calc(16px + var(--safe-bottom, 0px)); width: 98px; height: 98px; border-radius: 49px; }
  #ui.simplemode #fire { right: 14px; bottom: calc(124px + var(--safe-bottom, 0px)); width: 98px; height: 98px; border-radius: 49px; }
  #ebrake { position: absolute; right: 122px; bottom: calc(124px + var(--safe-bottom, 0px)); width: 98px; height: 98px; border-radius: 49px; border: 3px solid rgba(255,255,255,0.28); background: rgba(20,24,30,0.78); color: var(--fg-dim); font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: 0.1em; }
  #ebrake[hidden] { display: none; } #ebrake.held { background: rgba(120,230,255,0.22); border-color: #7fe8ff; color: var(--fg); }
  #ui.simplemode #special { right: 22px; bottom: calc(232px + var(--safe-bottom, 0px)); width: 70px; height: 70px; }
  #ui.simplemode #boost { right: 110px; bottom: calc(232px + var(--safe-bottom, 0px)); width: 70px; height: 70px; font-size: 11px; }
  #ui.lefty #puck, #ui.lefty #gas, #ui.lefty #fire { right: auto !important; left: 12px !important; }
  #ui.lefty #pad, #ui.lefty #ebrake { right: auto !important; left: 122px !important; }
  #ui.lefty #special { right: auto !important; left: 22px !important; } #ui.lefty #boost { right: auto !important; left: 110px !important; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #card { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 28px; box-sizing: border-box; }
  #card[hidden] { display: none; }
  #card .logo { font-size: 54px; font-weight: 700; letter-spacing: 0.3em; color: var(--player); text-shadow: 0 0 24px rgba(55,230,255,0.5); }
  #card .title { font-size: 15px; letter-spacing: 0.2em; color: var(--fg-dim); text-transform: uppercase; text-align: center; }
  #card .score { font-size: 52px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  #card .stars .grade { font-size: 64px; font-weight: 700; line-height: 44px; margin-right: 10px; color: #ffd23f; text-shadow: 0 0 14px rgba(255,210,63,0.6), 0 3px 0 rgba(0,0,0,0.5); align-self: center; font-style: italic; } #card .stars .grade.gS { color: #fff3a8; text-shadow: 0 0 18px rgba(255,160,40,0.9), 0 3px 0 rgba(0,0,0,0.5); } #card .stars .grade.gD, #card .stars .grade.gC { color: #b8bcc6; text-shadow: 0 3px 0 rgba(0,0,0,0.5); }
  #card .stars { align-items: center; display: flex; gap: 10px; margin: 2px 0 4px; } #card .stars svg { width: 44px; height: 44px; overflow: visible; } #card .stars svg path { fill: rgba(255,255,255,0.14); } #card .stars svg.on path { fill: #ffd23f; filter: drop-shadow(0 0 8px rgba(255,210,63,0.7)); }
  #card .newbest { font-size: 18px; letter-spacing: 0.2em; color: var(--pickup); font-weight: 700; }

  #card .bar i { display: block; height: 100%; background: var(--pickup); }

  #settings[hidden] { display: none; }
  /* the settings list scrolls inside the safe areas (the card keeps BACK clear of the home bar) */

  #settings label b { font-weight: 600; color: var(--fg-dim); margin-left: 6px; }

  /* the death card sits low so the replay plays in the top half behind it */
  #card.over { justify-content: flex-end; padding-bottom: calc(26px + var(--safe-bottom, 0px)); background: linear-gradient(to bottom, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.2) 38%, rgba(0,0,0,0.82) 52%); }

<body>
<div id="frame">
  <div id="stage">
    <div id="shake"><canvas id="cv"></canvas></div>
    <div id="ui">
      <div class="callout" id="callout" style="opacity:0"></div>
      <button id="pause" class="tap" aria-label="Pause"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="4" y="3" width="4" height="14" rx="1" fill="currentColor"/><rect x="12" y="3" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
      <button id="camBtn" class="tap" aria-label="Change camera" hidden>CAM B</button>
      <button id="special" class="tap" aria-label="Missile, hold to drop a shock mine" hidden><span id="specialIcon"></span><span class="pips" id="specialPips"></span><span class="mines" id="specialMines"></span></button>
      <button id="pad" class="tap" aria-label="Brake, hold to slow down, hold while steering to drift" hidden>BRAKE</button>
      <button id="gas" class="tap" aria-label="Gas, hold to speed up" hidden>GAS</button>
      <button id="fire" class="tap" aria-label="Fire, hold for the gatling" hidden>FIRE</button>
      <button id="boost" class="tap" aria-label="Boost, a short strong burst of speed" hidden><span class="blbl">BOOST</span></button>
      <button id="ebrake" class="tap" aria-label="E-brake: drift in a turn, a 180 with full steer, a burnout with gas at a stop" hidden>E-BRAKE</button>
      <div id="puck" class="tap" aria-label="Drive: touch for gas, pull down to brake and reverse, slide right to fire, slide left for the e-brake" hidden><span class="pz pzU">GAS</span><span class="pz pzD">BRAKE<br>REV</span><span class="pz pzR">FIRE</span><span class="pz pzL">E-BRAKE</span><span class="pring"></span><span id="puckDot"></span></div>
      <div id="card" hidden>
        <div class="logo" id="cardLogo" hidden>SHUNT</div>
        <div class="title" id="cardTitle"></div>
        <div class="score" id="cardScore">0</div>
        <div class="stars" id="cardStars" hidden></div>
        <div class="newbest" id="cardNewBest" hidden>NEW BEST</div>
        <div class="lines" id="cardLines"></div>
        <div class="bar" id="cardBar" hidden><i id="cardBarFill" style="width:0%"></i></div>
        <div id="settings" hidden>
          <div class="grp">Audio</div>
          <label><span>Sound</span><button class="sw tap" id="sSound" role="switch" aria-label="Sound"></button></label>
          <label><span>Music</span><button class="sw tap" id="sMusic" role="switch" aria-label="Music"></button></label>
          <div class="grp">Controls</div>
          <label><span>Special button side</span><button class="sw seg tap" id="sHand">RIGHT</button></label>
          <label><span>Sensitivity <b id="sSensVal">1.0×</b></span><input id="sSens" type="range" min="0.7" max="1.6" step="0.1" value="1" aria-label="Sensitivity"></label>
          <label><span>Camera <b>A high, B chase, C close behind</b></span><button class="sw seg tap" id="sCam3" aria-label="Camera">B</button></label>
          <label><span>Simple buttons <b>GAS, BRAKE, FIRE and E-BRAKE instead of the puck</b></span><button class="sw tap" id="sSimple" role="switch" aria-label="Simple buttons"></button></label>
          <label><span>Fewer hero shots <b>the replay-style cutaways</b></span><button class="sw tap" id="sFewShots" role="switch" aria-label="Fewer hero shots"></button></label>
          <label><span>Tap half to Slam</span><button class="sw tap" id="sTapSlam" role="switch" aria-label="Tap half to Slam"></button></label>
          <label style="display:none"><span>Auto-drift <b>hard turns drift by themselves</b></span><button class="sw tap" id="sAutoDrift" role="switch" aria-label="Auto-drift"></button></label>
          <div class="grp">Accessibility</div>
          <label><span>Haptics</span><button class="sw tap" id="sHaptics" role="switch" aria-label="Haptics"></button></label>
          <label><span>Screen shake</span><button class="sw tap" id="sShake" role="switch" aria-label="Screen shake"></button></label>
          <label><span>Reduce motion</span><button class="sw tap" id="sMotion" role="switch" aria-label="Reduce motion"></button></label>
          <div class="grp">Graphics</div>
          <label><span>Graphics <b id="sGfxNote">auto picks what holds 50 fps</b></span><button class="sw seg tap" id="sGfx" aria-label="Graphics quality">AUTO</button></label>
          <div class="grp">Developer</div>
          <label><span>Benchmark <b>a skilled run, then results</b></span><button class="sw seg tap" id="sBench">RUN</button></label>
          <label><span>Show FPS <b>now and 10 s low</b></span><button class="sw tap" id="sDebug" role="switch" aria-label="Show FPS"></button></label>
          <label><span>Tune panel <b>live look values</b></span><button class="sw tap" id="sTune" role="switch" aria-label="Tune panel"></button></label>
          <label><span>Frame counter</span><button class="sw tap" id="sPerf" role="switch" aria-label="Frame counter"></button></label>
        </div>
        <div class="camsel" id="camSel" hidden><span>CAMERA</span><button class="tap" data-c="A">A HIGH</button><button class="tap" data-c="B">B CHASE</button><button class="tap" data-c="C">C CLOSE</button></div>
        <button class="btn tap" id="btnPrimary">DRIVE AGAIN</button>
        <div class="row" id="cardRow">
          <button class="btn tap" id="btnA">NEW ROAD</button>
          <button class="btn tap" id="btnB">DAILY RUN</button>
          <button class="btn tap" id="btnC">SETTINGS</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
